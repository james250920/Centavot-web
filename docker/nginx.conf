server {
    listen 4231;
    listen [::]:4231;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Compresión: la página la ven celulares con datos móviles.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Imágenes, estilos y script: caché de un día en el celular.
    location ~* \.(webp|png|css|js)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Los registros de origen de las imágenes no se publican.
    location ~* \.json$ {
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
